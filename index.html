<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPFACE — Make-Up Style</title>
<meta name="description" content="TOPFACE is a modern premium beauty brand for face, eyes, lips and skin.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#1B1712;
    --ink-soft:#3A332C;
    --base:#EDE7DE;
    --surface:#FFFFFF;
    --accent:#7A1330;
    --accent-ink:#FFFFFF;
    --gold:#A9824C;
    --muted:#8C8272;
    --line: rgba(27,23,18,0.14);
    --line-soft: rgba(27,23,18,0.08);
    --radius: 2px;
    --maxw: 1280px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--base);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    font-weight:400;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  html[dir="rtl"] body{ font-feature-settings:"kern"; }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding-inline:24px;}
  @media (max-width:640px){ .wrap{padding-inline:16px;} }

  /* ---------- Header ---------- */
  header.site{
    position:sticky;top:0;z-index:50;
    background:rgba(237,231,222,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-row{
    display:flex;align-items:center;justify-content:space-between;
    padding-block:16px;gap:16px;
  }
  .wordmark{font-size:24px;font-weight:800;letter-spacing:0.01em;}
  .wordmark small{display:block;font-size:9px;font-weight:600;letter-spacing:0.22em;color:var(--muted);margin-top:2px;}

  .brand-logo{height:38px;width:auto;display:block;}
  .brand-logo.footer{height:30px;}
  nav.primary{display:flex;gap:28px;align-items:center;}
  nav.primary a{font-size:14px;font-weight:600;padding-block:4px;border-bottom:1px solid transparent;transition:border-color .15s;}
  nav.primary a:hover, nav.primary a.active{border-color:var(--ink);}
  .header-actions{display:flex;align-items:center;gap:18px;}
  .lang-btn{font-size:12px;font-weight:700;letter-spacing:.04em;border:1px solid var(--ink);background:none;padding:6px 10px;cursor:pointer;color:var(--ink);}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink);position:relative;padding:4px;}
  .icon-btn svg{width:22px;height:22px;}
  .cart-count{position:absolute;top:-4px;inset-inline-end:-6px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;}
  .search-wrap{flex:1;max-width:360px;position:relative;}
  .search-wrap input{width:100%;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-family:inherit;font-size:14px;}
  .mobile-nav-toggle{display:none;background:none;border:none;cursor:pointer;}
  @media (max-width:920px){
    nav.primary{display:none;}
    .search-wrap{display:none;}
    .mobile-nav-toggle{display:block;}
  }
  .mobile-drawer{position:fixed;inset:0;background:var(--base);z-index:100;transform:translateX(100%);transition:transform .25s ease;padding:20px;overflow:auto;}
  html[dir="rtl"] .mobile-drawer{transform:translateX(-100%);}
  .mobile-drawer.open{transform:translateX(0);}
  .mobile-drawer nav{display:flex;flex-direction:column;gap:22px;margin-top:40px;}
  .mobile-drawer nav a{font-size:22px;font-weight:700;}
  .mobile-drawer .close-x{background:none;border:none;font-size:28px;cursor:pointer;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 26px;font-size:13px;font-weight:700;letter-spacing:.03em;
    border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;
    transition:opacity .15s; border-radius:var(--radius);
  }
  .btn:hover{opacity:.82;}
  .btn.outline{background:none;color:var(--ink);}
  .btn.accent{background:var(--accent);border-color:var(--accent);}
  .btn[disabled]{opacity:.4;cursor:not-allowed;}
  .btn.block{width:100%;}
  .btn.sm{padding:8px 16px;font-size:12px;}

  /* ---------- Hero ---------- */
  .hero{display:grid;grid-template-columns:1.1fr 1fr;min-height:560px;}
  @media (max-width:860px){.hero{grid-template-columns:1fr;min-height:auto;}}
  .hero-copy{display:flex;flex-direction:column;justify-content:center;padding:60px;gap:22px;}
  @media (max-width:640px){.hero-copy{padding:32px 20px;}}
  .hero-eyebrow{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.03em;}
  .hero h1{font-size:clamp(40px,6vw,68px);font-weight:800;line-height:1.02;margin:0;max-width:11ch;}
  .hero p{font-size:17px;color:var(--ink-soft);max-width:42ch;margin:0;}
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;}
  .hero-img{position:relative;background:var(--ink);min-height:320px;overflow:hidden;}
  .hero-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .6s;}
  .hero-img img.ready{opacity:1;}
  .hero-img .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--base);font-size:15px;letter-spacing:.3em;text-transform:uppercase;opacity:.5;}

  /* ---------- Category tiles ---------- */
  .section{padding-block:64px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap;}
  .section-head h2{font-size:26px;font-weight:800;margin:0;}
  .section-head .view-all{font-size:13px;font-weight:700;border-bottom:1px solid var(--ink);}
  .cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);}
  @media (max-width:860px){.cat-grid{grid-template-columns:repeat(2,1fr);}}
  .cat-tile{background:var(--surface);padding:34px 20px;display:flex;flex-direction:column;gap:6px;transition:background .15s;}
  .cat-tile:hover{background:var(--base);}
  .cat-tile .cn{font-size:19px;font-weight:700;}
  .cat-tile .cs{font-size:12px;color:var(--muted);}

  /* ---------- Product grid / card ---------- */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 20px;}
  @media (max-width:940px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:20px 12px;}}
  .card{display:flex;flex-direction:column;gap:10px;cursor:pointer;}
  .card-img{aspect-ratio:4/5;background:var(--surface);border:1px solid var(--line-soft);position:relative;overflow:hidden;}
  .card-img img{width:100%;height:100%;object-fit:cover;}
  .card-img .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;letter-spacing:.15em;text-transform:uppercase;}
  .badge{position:absolute;top:10px;inset-inline-start:10px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;padding:4px 8px;letter-spacing:.04em;}
  .badge.sale{background:var(--accent);}
  .badge.out{background:var(--muted);}
  .card-cat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .card-name{font-size:14px;font-weight:600;line-height:1.3;}
  .card-price{font-size:14px;font-weight:700;display:flex;gap:8px;align-items:baseline;}
  .card-price .was{color:var(--muted);text-decoration:line-through;font-weight:400;font-size:12px;}
  .card-price .now{color:var(--accent);}

  .filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:26px;}
  .filters select, .filters input[type=text]{border:1px solid var(--line);background:var(--surface);padding:9px 12px;font-family:inherit;font-size:13px;}
  .chip{border:1px solid var(--ink);padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;background:none;}
  .chip.active{background:var(--ink);color:#fff;}

  .empty-state{padding:70px 20px;text-align:center;border:1px dashed var(--line);color:var(--muted);}
  .empty-state h3{color:var(--ink);font-size:18px;margin:0 0 8px;}
  .empty-state p{margin:0 0 18px;font-size:14px;}
  .skeleton{background:linear-gradient(90deg, var(--line-soft) 25%, var(--line) 37%, var(--line-soft) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

  /* ---------- Editorial block ---------- */
  .editorial{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:stretch;background:var(--ink);color:var(--base);}
  @media (max-width:860px){.editorial{grid-template-columns:1fr;}}
  .editorial-img{min-height:340px;background:#000;position:relative;overflow:hidden;}
  .editorial-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85;}
  .editorial-copy{padding:60px;display:flex;flex-direction:column;justify-content:center;gap:18px;}
  @media (max-width:640px){.editorial-copy{padding:32px 20px;}}
  .editorial-eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--gold);}
  .editorial-copy h2{font-size:clamp(26px,3.4vw,38px);font-weight:800;line-height:1.15;margin:0;max-width:15ch;}
  .editorial-copy p{opacity:.75;max-width:42ch;margin:0;font-size:15px;}

  /* ---------- Footer ---------- */
  footer.site{border-top:1px solid var(--line);margin-top:40px;}
  .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:40px;padding-block:56px;}
  @media (max-width:780px){.footer-grid{grid-template-columns:1fr 1fr;}}
  .footer-grid h4{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 16px;}
  .footer-grid ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .footer-grid a{font-size:14px;}
  .footer-grid a:hover{color:var(--accent);}
  .footer-bottom{border-top:1px solid var(--line);padding-block:20px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);flex-wrap:wrap;gap:10px;}
  .nl-form{display:flex;gap:0;border:1px solid var(--ink);margin-top:8px;}
  .nl-form input{flex:1;border:none;background:none;padding:10px 12px;font-family:inherit;font-size:13px;}
  .nl-form button{border:none;background:var(--ink);color:#fff;padding:0 16px;cursor:pointer;font-size:12px;font-weight:700;}

  /* ---------- Breadcrumb / page head ---------- */
  .page-head{padding-block:36px 10px;}
  .crumb{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .crumb a:hover{color:var(--ink);}
  .page-title{font-size:32px;font-weight:800;margin:0;}

  /* ---------- Product detail ---------- */
  .pd{display:grid;grid-template-columns:1fr 1fr;gap:56px;padding-block:40px 70px;}
  @media (max-width:860px){.pd{grid-template-columns:1fr;gap:26px;}}
  .pd-gallery{display:flex;flex-direction:column;gap:10px;}
  .pd-main-img{aspect-ratio:4/5;background:var(--surface);border:1px solid var(--line-soft);overflow:hidden;position:relative;}
  .pd-main-img img{width:100%;height:100%;object-fit:cover;}
  .pd-thumbs{display:flex;gap:8px;overflow:auto;}
  .pd-thumbs img{width:74px;height:88px;object-fit:cover;border:1px solid var(--line);cursor:pointer;flex:none;}
  .pd-thumbs img.active{border-color:var(--ink);border-width:2px;}
  .pd-info{display:flex;flex-direction:column;gap:16px;}
  .pd-cat{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
  .pd-name{font-size:30px;font-weight:800;margin:0;line-height:1.15;}
  .pd-price{font-size:22px;font-weight:700;display:flex;gap:10px;align-items:baseline;}
  .pd-price .was{color:var(--muted);text-decoration:line-through;font-size:16px;font-weight:400;}
  .pd-price .now{color:var(--accent);}
  .pd-short{color:var(--ink-soft);font-size:15px;}
  .pd-stock{font-size:13px;font-weight:600;}
  .pd-stock.ok{color:#3a6b3a;}
  .pd-stock.low{color:var(--gold);}
  .pd-stock.out{color:var(--accent);}
  .swatches{display:flex;flex-wrap:wrap;gap:10px;}
  .swatch{border:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;background:var(--surface);}
  .swatch.active{border-color:var(--ink);border-width:2px;}
  .swatch .dot{width:16px;height:16px;border-radius:50%;border:1px solid var(--line);flex:none;}
  .swatch[disabled]{opacity:.35;cursor:not-allowed;text-decoration:line-through;}
  .chips-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chips-row .tag{border:1px solid var(--line);padding:5px 12px;font-size:12px;color:var(--ink-soft);}
  .qty-row{display:flex;align-items:center;gap:14px;}
  .qty-stepper{display:flex;align-items:center;border:1px solid var(--ink);}
  .qty-stepper button{width:38px;height:40px;background:none;border:none;cursor:pointer;font-size:16px;}
  .qty-stepper span{width:40px;text-align:center;font-weight:700;}
  .pd-tabs{margin-top:16px;border-top:1px solid var(--line);}
  .pd-tab{border-bottom:1px solid var(--line);}
  .pd-tab-head{display:flex;justify-content:space-between;align-items:center;padding:16px 0;cursor:pointer;font-weight:700;font-size:14px;}
  .pd-tab-body{display:none;padding-bottom:18px;font-size:14px;color:var(--ink-soft);line-height:1.7;white-space:pre-line;}
  .pd-tab.open .pd-tab-body{display:block;}
  .pd-tab.open .pd-tab-head .chev{transform:rotate(180deg);}

  /* ---------- Cart drawer ---------- */
  .overlay{position:fixed;inset:0;background:rgba(27,23,18,.4);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .cart-drawer{position:fixed;top:0;inset-inline-end:0;width:min(420px,100%);height:100%;background:var(--surface);z-index:95;
    transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;}
  html[dir="rtl"] .cart-drawer{transform:translateX(-105%);}
  .cart-drawer.open{transform:translateX(0);}
  .cd-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line);}
  .cd-head h3{margin:0;font-size:17px;font-weight:800;}
  .cd-items{flex:1;overflow:auto;padding:10px 22px;}
  .cd-item{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line-soft);}
  .cd-item img{width:64px;height:76px;object-fit:cover;border:1px solid var(--line-soft);flex:none;}
  .cd-item-info{flex:1;display:flex;flex-direction:column;gap:6px;}
  .cd-item-name{font-size:13px;font-weight:700;}
  .cd-item-meta{font-size:12px;color:var(--muted);}
  .cd-item-row{display:flex;justify-content:space-between;align-items:center;}
  .cd-item-remove{font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;}
  .cd-foot{border-top:1px solid var(--line);padding:20px 22px;display:flex;flex-direction:column;gap:14px;}
  .cd-subtotal{display:flex;justify-content:space-between;font-size:15px;font-weight:700;}

  /* ---------- Cart page / checkout ---------- */
  .cart-table{width:100%;border-collapse:collapse;}
  .cart-table th{text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-block:10px;border-bottom:1px solid var(--line);}
  .cart-table td{padding-block:18px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  .ct-prod{display:flex;gap:14px;align-items:center;}
  .ct-prod img{width:64px;height:76px;object-fit:cover;border:1px solid var(--line-soft);}
  .checkout-layout{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;padding-block:30px 70px;align-items:start;}
  @media (max-width:900px){.checkout-layout{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .field label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);padding:12px 14px;font-family:inherit;font-size:14px;}
  .field input.err,.field select.err{border-color:var(--accent);}
  .field .errtext{font-size:12px;color:var(--accent);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:480px){.field-row{grid-template-columns:1fr;}}
  .pay-option{border:1px solid var(--ink);padding:16px;display:flex;gap:12px;align-items:flex-start;}
  .summary-box{border:1px solid var(--line);padding:24px;background:var(--surface);position:sticky;top:100px;}
  .summary-line{display:flex;justify-content:space-between;font-size:14px;padding-block:8px;}
  .summary-line.total{font-weight:800;font-size:17px;border-top:1px solid var(--line);margin-top:8px;padding-top:16px;}
  .summary-line .muted{color:var(--muted);}

  .confirm-wrap{max-width:640px;margin:0 auto;padding-block:80px;text-align:center;}
  .confirm-check{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:30px;}
  .confirm-order-box{border:1px solid var(--line);text-align:start;margin-top:34px;padding:24px;}
  .confirm-order-row{display:flex;justify-content:space-between;padding-block:10px;border-bottom:1px solid var(--line-soft);font-size:14px;}

  .toast-host{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;}
  html[dir="rtl"] .toast-host{transform:translateX(50%);}
  .toast{background:var(--ink);color:#fff;padding:12px 20px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:toastin .2s;}
  @keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;}
  @keyframes spin{to{transform:rotate(360deg)}}

  [data-only-rtl]{display:none;} html[dir="rtl"] [data-only-rtl]{display:initial;}
  [data-only-ltr]{display:initial;} html[dir="rtl"] [data-only-ltr]{display:none;}
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay" id="overlay"></div>
<div class="cart-drawer" id="cartDrawer"></div>
<div class="mobile-drawer" id="mobileDrawer"></div>
<div class="toast-host" id="toastHost"></div>

<script>
/* =======================================================================
   TOPFACE Store — single-file SPA. No build step, by design (matches the
   rest of the project). Talks directly to Supabase with the anon key;
   all pricing/stock-sensitive writes go through the place_order() RPC.
   ======================================================================= */

const SUPABASE_URL = "https://gyudtdfbbxnxaondmqsa.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5dWR0ZGZiYnhueGFvbmRtcXNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NDA3NDEsImV4cCI6MjEwNDQxNjc0MX0.AfChwGLlavRBBrkKBYCy25-7B4VIldDoE2sY990LbAc";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------------- i18n ---------------- */
/* ---------------- Jordan governorates & districts ---------------- */
const JORDAN_GOVERNORATES = [
  { en:'Amman', ar:'عمان', districts:[
    {en:'Qasabat Amman', ar:'قصبة عمان'}, {en:'Al-Jame\u2019a', ar:'الجامعة'}, {en:'Quwaismeh', ar:'القويسمة'},
    {en:'Marka', ar:'ماركا'}, {en:'Jiza', ar:'الجيزة'}, {en:'Muwaqqar', ar:'الموقر'},
    {en:'Na\u2019our', ar:'ناعور'}, {en:'Sahab', ar:'سحاب'}, {en:'Wadi As-Seer', ar:'وادي السير'}
  ]},
  { en:'Irbid', ar:'إربد', districts:[
    {en:'Qasabat Irbid', ar:'قصبة إربد'}, {en:'Ramtha', ar:'الرمثا'}, {en:'Koura', ar:'الكورة'},
    {en:'Bani Kinanah', ar:'بني كنانة'}, {en:'Bani Obeid', ar:'بني عبيد'}, {en:'Northern Ghor', ar:'الأغوار الشمالية'},
    {en:'Al-Mazar Ash-Shamali', ar:'المزار الشمالي'}, {en:'Wastiyeh', ar:'الوسطية'}, {en:'Taybeh', ar:'الطيبة'}
  ]},
  { en:'Zarqa', ar:'الزرقاء', districts:[
    {en:'Qasabat Zarqa', ar:'قصبة الزرقاء'}, {en:'Russeifa', ar:'الرصيفة'}, {en:'Hashimiyeh', ar:'الهاشمية'}, {en:'Azraq', ar:'الأزرق'}

let LANG = localStorage.getItem('tf_lang') || 'en';
function t(key){
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
  return s;
}
function applyLangAttrs(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
}
function setLang(l){ LANG = l; localStorage.setItem('tf_lang', l); applyLangAttrs(); router(); }
function field(obj, base){ // returns localized field e.g. name / name_ar
  if(!obj) return '';
  if(LANG === 'ar' && obj[base+'_ar']) return obj[base+'_ar'];
  return obj[base] || (LANG==='ar' ? (obj[base+'_ar']||'') : '') || '';
}

/* ---------------- utils ---------------- */
function esc(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtPrice(n){
  n = Number(n||0);
  const s = n.toLocaleString(LANG==='ar' ? 'ar-JO' : 'en-US', {minimumFractionDigits: n % 1 === 0 ? 0 : 2, maximumFractionDigits:2});
  return LANG === 'ar' ? `${s} د.أ` : `JOD ${s}`;
}
function toast(msg){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}
function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function navigate(hash){ window.location.hash = hash; }
function isValidEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e||''); }

/* ---------------- cart (localStorage) ---------------- */
const CART_KEY = 'tf_cart_v1';
function getCart(){ try{ return JSON.parse(localStorage.getItem(CART_KEY)) || []; }catch(e){ return []; } }
function saveCart(c){ localStorage.setItem(CART_KEY, JSON.stringify(c)); renderCartCount(); }
function cartAdd(item){
  const cart = getCart();
  const existing = cart.find(i => i.product_id === item.product_id && i.variant_id === item.variant_id);
  if(existing){ existing.qty += item.qty; }
  else cart.push(item);
  saveCart(cart);
  toast(t('added_to_cart'));
  renderCartDrawer();
}
function cartRemove(product_id, variant_id){
  saveCart(getCart().filter(i => !(i.product_id===product_id && i.variant_id===variant_id)));
  renderCartDrawer();
}
function cartSetQty(product_id, variant_id, qty){
  const cart = getCart();
  const it = cart.find(i => i.product_id===product_id && i.variant_id===variant_id);
  if(it){ it.qty = Math.max(1, qty); saveCart(cart); }
  renderCartDrawer();
}
function cartCount(){ return getCart().reduce((s,i)=>s+i.qty,0); }
function cartSubtotal(){ return getCart().reduce((s,i)=>s + i.price*i.qty, 0); }
function renderCartCount(){
  qsa('.cart-count').forEach(el => el.remove());
  const n = cartCount();
  if(n > 0){
    qsa('.icon-btn[data-cart-toggle]').forEach(btn=>{
      const b = document.createElement('span'); b.className='cart-count'; b.textContent = n;
      btn.appendChild(b);
    });
  }
}

function pushRecent(id){
  let arr = JSON.parse(localStorage.getItem(RV_KEY) || '[]').filter(x=>x!==id);
  arr.unshift(id);
  arr = arr.slice(0,8);
  localStorage.setItem(RV_KEY, JSON.stringify(arr));
}

/* ---------------- site settings ---------------- */
let SITE_SETTINGS = {};
async function loadSiteSettings(){
  const {data, error} = await sb.from('site_settings').select('key,value');
  if(!error && data){ data.forEach(r => SITE_SETTINGS[r.key] = r.value); }
}
function estimateShipping(subtotal){
  const s = SITE_SETTINGS.shipping;
  if(!s) return 0;
  if(s.free_over !== undefined && s.free_over !== null && subtotal >= Number(s.free_over)) return 0;
  return Number(s.flat_fee || 0);
}

/* ---------------- data layer ---------------- */
let CATEGORIES = [];
async function loadCategories(){
  if(CATEGORIES.length) return CATEGORIES;
  const {data, error} = await sb.from('categories').select('*').eq('is_active', true).order('sort_order');
  if(error){ console.error(error); return []; }
  CATEGORIES = data || [];
  return CATEGORIES;
}
async function fetchProducts({categorySlug, search, sort, featured, bestseller, newArrival, limit} = {}){
  let q = sb.from('products').select('*, product_images(*), category:categories(name,name_ar,slug)').eq('is_active', true);
  if(categorySlug){
    const cat = CATEGORIES.find(c=>c.slug===categorySlug);
    if(cat) q = q.eq('category_id', cat.id);
  }
  if(search) q = q.or(`name.ilike.%${search}%,name_ar.ilike.%${search}%`);
  if(featured) q = q.eq('is_featured', true);
  if(bestseller) q = q.eq('is_bestseller', true);
  if(newArrival) q = q.eq('is_new_arrival', true);
  if(sort === 'price_low') q = q.order('price', {ascending:true});
  else if(sort === 'price_high') q = q.order('price', {ascending:false});
  else q = q.order('created_at', {ascending:false});
  if(limit) q = q.limit(limit);
  const {data, error} = await q;
  if(error){ console.error(error); return []; }
  return data || [];
}
async function fetchProductBySlug(slug){
  const {data, error} = await sb.from('products')
    .select('*, product_images(*), product_variants(*), category:categories(name,name_ar,slug)')
    .eq('slug', slug).eq('is_active', true).maybeSingle();
  if(error){ console.error(error); return null; }
  return data;
}
async function fetchProductsByIds(ids){
  if(!ids.length) return [];
  const {data, error} = await sb.from('products').select('*, product_images(*)').in('id', ids).eq('is_active', true);
  if(error) return [];
  return data || [];
}
async function fetchApprovedReviews(productId){
  const {data, error} = await sb.from('reviews').select('*').eq('product_id', productId).eq('is_approved', true).order('created_at',{ascending:false});
  if(error) return [];
  return data || [];
}
async function submitReview(productId, payload){
  return sb.from('reviews').insert({ product_id: productId, customer_name: payload.name, rating: payload.rating, comment: payload.comment || null });
}

function mainImage(product){
  const imgs = (product.product_images||[]).slice().sort((a,b)=>a.sort_order-b.sort_order);
  return imgs.length ? imgs[0].url : null;
}
function priceOf(product){ return Number(product.sale_price || product.price || 0); }
function compareAtOf(product){
  const p = Number(product.price||0), s = Number(product.sale_price||0);
  return (s && s < p) ? p : (product.compare_at_price && Number(product.compare_at_price) > priceOf(product) ? Number(product.compare_at_price) : null);
}

/* ---------------- render: cards ---------------- */
function productCardHTML(p){
  const img = mainImage(p);
  const name = field(p,'name');
  const price = priceOf(p);
  const was = compareAtOf(p);
  const out = (p.inventory||0) <= 0;
  return `
  <a class="card" href="#/product/${esc(p.slug)}">
    <div class="card-img">
      ${img ? `<img src="${esc(img)}" alt="${esc(name)}" loading="lazy">` : `<div class="ph">TOPFACE</div>`}
      ${out ? `<span class="badge out">${t('out_of_stock')}</span>` : (was ? `<span class="badge sale">SALE</span>` : (p.is_new_arrival ? `<span class="badge">${t('new_arrivals')}</span>`:''))}
    </div>
    <div class="card-cat">${esc(field(p.category||{}, 'name'))}</div>
    <div class="card-name">${esc(name)}</div>
    <div class="card-price">
      ${was ? `<span class="was">${fmtPrice(was)}</span>` : ''}
      <span class="${was?'now':''}">${fmtPrice(price)}</span>
    </div>
  </a>`;
}
function productGridSkeleton(n){
  return `<div class="grid">${Array.from({length:n}).map(()=>`
    <div class="card"><div class="card-img skeleton"></div><div class="skeleton" style="height:11px;width:40%"></div><div class="skeleton" style="height:14px;width:80%"></div></div>
  `).join('')}</div>`;
}
function emptyState(title, body, cta){
  return `<div class="empty-state"><h3>${esc(title)}</h3><p>${esc(body)}</p>${cta||''}</div>`;
}

async function submitNewsletter(e){
  e.preventDefault();
  const email = e.target.email.value.trim();
  if(!isValidEmail(email)) return false;
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  const {error} = await sb.from('newsletter_subscribers').insert({email});
  btn.disabled = false;
  if(!error){ toast(t('subscribed')); e.target.reset(); }
  return false;
}

/* ---------------- cart drawer ---------------- */
function toggleCart(open){
  qs('#cartDrawer').classList.toggle('open', open);
  qs('#overlay').classList.toggle('open', open);
  if(open) renderCartDrawer();
}
async function renderCartDrawer(){
  const drawer = qs('#cartDrawer');
  const cart = getCart();
  if(!cart.length){
    drawer.innerHTML = `
      <div class="cd-head"><h3>${t('cart_title')}</h3><button class="close-x" onclick="toggleCart(false)">&times;</button></div>
      <div class="cd-items">${emptyState(t('cart_empty_title'), t('cart_empty_body'))}</div>
      <div class="cd-foot"><button class="btn block" onclick="toggleCart(false)">${t('continue_shopping')}</button></div>`;
    renderCartCount();
    return;
  }
  drawer.innerHTML = `
    <div class="cd-head"><h3>${t('cart_title')} (${cartCount()})</h3><button class="close-x" onclick="toggleCart(false)">&times;</button></div>
    <div class="cd-items">
      ${cart.map(i => `
        <div class="cd-item">
          ${i.image ? `<img src="${esc(i.image)}" alt="">` : `<div style="width:64px;height:76px;background:var(--base);flex:none;"></div>`}
          <div class="cd-item-info">
            <div class="cd-item-name">${esc(i.name)}</div>
            ${i.shade ? `<div class="cd-item-meta">${esc(i.shade)}</div>` : ''}
            <div class="cd-item-row">
              <div class="qty-stepper">
                <button onclick="cartSetQty('${i.product_id}', ${i.variant_id?`'${i.variant_id}'`:null}, ${i.qty-1})">−</button>
                <span>${i.qty}</span>
                <button onclick="cartSetQty('${i.product_id}', ${i.variant_id?`'${i.variant_id}'`:null}, ${i.qty+1})">+</button>
              </div>
              <strong>${fmtPrice(i.price*i.qty)}</strong>
            </div>
            <button class="cd-item-remove" onclick="cartRemove('${i.product_id}', ${i.variant_id?`'${i.variant_id}'`:null})">${t('remove')}</button>
          </div>
        </div>`).join('')}
    </div>
    <div class="cd-foot">
      <div class="cd-subtotal"><span>${t('subtotal')}</span><span>${fmtPrice(cartSubtotal())}</span></div>
      <button class="btn accent block" onclick="toggleCart(false); navigate('#/checkout')">${t('proceed_checkout')}</button>
      <button class="btn outline block" onclick="toggleCart(false)">${t('continue_shopping')}</button>
    </div>`;
  renderCartCount();
}

function selectVariant(vid){
  qsa('#swatchRow .swatch').forEach(b=>b.classList.toggle('active', b.dataset.vid===vid));

  pdSelectedVariant = vid;
  const stock = Number(btn.dataset.stock);
  const stockEl = qs('#pdStock');
  stockEl.className = 'pd-stock ' + (stock<=0?'out':(stock<=5?'low':'ok'));
  stockEl.textContent = stock<=0?t('out_of_stock'):(stock<=5?t('low_stock').replace('{n}',stock):t('in_stock'));
  qs('#pdAddBtn').disabled = stock<=0;
}
function pdChangeQty(delta){
  const el = qs('#pdQty');
  el.textContent = Math.max(1, Number(el.textContent)+delta);
}
function pdAddToCart(){
  const p = currentProduct;
  const qty = Number(qs('#pdQty').textContent);
  const variants = (p.product_variants||[]).filter(v=>v.is_active);
  let variant = null;
  if(variants.length){
    const vid = pdSelectedVariant || variants[0].id;
    variant = variants.find(v=>v.id===vid);
  }
  cartAdd({
    product_id: p.id,
    variant_id: variant ? variant.id : null,
    name: field(p,'name'),
    shade: variant ? (variant.shade_name || variant.shade_number) : null,
    price: variant ? Number(variant.price_override || priceOf(p)) : priceOf(p),
    image: mainImage(p),
    slug: p.slug,
    qty
  });
}

async function handleCheckoutSubmit(e){
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form).entries());
  // validation
  let valid = true;
  qsa('.field input[required], .field textarea[required]', form).forEach(el=>el.classList.remove('err'));
  const requiredFields = ['full_name','phone','email','city','street_address'];
  requiredFields.forEach(name=>{
    const el = form.querySelector(`[name="${name}"]`);
    if(!data[name] || !data[name].trim()){ el.classList.add('err'); valid = false; }
  });
  if(data.email && !isValidEmail(data.email)){ form.querySelector('[name="email"]').classList.add('err'); valid = false; }
  if(!valid){ toast(t('required_field')); return; }

  const btn = qs('#placeOrderBtn');
  btn.disabled = true; btn.textContent = '…';

  const cart = getCart();
  const effectiveArea = data.area === '__other__' ? (data.area_other || '').trim() : (data.area || null);
  const payload = {
    customer: { email: data.email, full_name: data.full_name, phone: data.phone, whatsapp: data.whatsapp || null },
    shipping: { city: data.city, area: effectiveArea || null, street_address: data.street_address, notes: data.notes || null },
    items: cart.map(i => ({ product_id: i.product_id, variant_id: i.variant_id || null, quantity: i.qty })),
    coupon_code: data.coupon_code || null,
    payment_method: data.payment_method || 'cash_on_delivery'
  };

  const {data: result, error} = await sb.rpc('place_order', {payload});
  btn.disabled = false; btn.textContent = t('place_order');

  if(error){
    console.error(error);
    toast(error.message && error.message.length < 80 ? error.message : t('order_error'));
    return;
  }
  localStorage.setItem('tf_last_order', JSON.stringify(result));
  localStorage.removeItem(CART_KEY);
  renderCartCount();
  navigate('#/order-confirmation');
}

          <p style="color:var(--ink-soft);">${t('order_thanks')}</p>
          <div class="confirm-order-box">
            <div class="confirm-order-row"><span>${t('order_number')}</span><strong>${esc(order.order_number)}</strong></div>
            ${order.items.map(i=>`<div class="confirm-order-row"><span>${esc(i.product_name)}${i.shade_name?` (${esc(i.shade_name)})`:''} × ${i.quantity}</span><span>${fmtPrice(i.line_total)}</span></div>`).join('')}
            <div class="confirm-order-row"><span>${t('subtotal')}</span><span>${fmtPrice(order.subtotal)}</span></div>
            <div class="confirm-order-row"><span>${t('shipping')}</span><span>${fmtPrice(order.shipping_fee)}</span></div>
            ${order.discount>0?`<div class="confirm-order-row"><span>${t('discount')}</span><span>-${fmtPrice(order.discount)}</span></div>`:''}
            <div class="confirm-order-row" style="font-weight:800;font-size:16px;border-bottom:none;"><span>${t('total')}</span><span>${fmtPrice(order.total)}</span></div>
          </div>
          <p style="font-size:13px;color:var(--muted);margin-top:20px;">${t('cod_note')}</p>
          <a class="btn accent" style="margin-top:24px;" href="#/">${t('back_home')}</a>
        ` : emptyState('No recent order found','', `<a class="btn accent" href="#/">${t('back_home')}</a>`)}
      </div>
    </main>
    ${footerHTML()}
  `;
  renderCartCount();
}

function pageStatic(title, bodyHtml){
  qs('#app').innerHTML = `
    ${headerHTML()}
    <main class="wrap">
      <div class="page-head"><h1 class="page-title">${esc(title)}</h1></div>
      <div style="max-width:70ch;padding-block:10px 60px;font-size:15px;color:var(--ink-soft);line-height:1.8;">${bodyHtml}</div>
    </main>
    ${footerHTML()}
  `;
  renderCartCount();
}
function page404(){
  qs('#app').innerHTML = `${headerHTML()}<main class="wrap section">${emptyState('Page not found','', `<a class="btn accent" href="#/">${t('back_home')}</a>`)}</main>${footerHTML()}`;
  renderCartCount();
}

/* ---------------- router ---------------- */
async function router(){
  try{
    toggleCart(false); toggleMobile(false);
    const raw = window.location.hash.replace(/^#/,'') || '/';
    const [pathPart, queryPart] = raw.split('?');
    const parts = pathPart.split('/').filter(Boolean);
    const params = Object.fromEntries(new URLSearchParams(queryPart||''));

    if(parts.length===0){ await pageHome(); return; }
    if(parts[0]==='shop'){ await pageShop(params); return; }
    if(parts[0]==='category' && parts[1]){ await pageCategory(parts[1], params); return; }
    if(parts[0]==='product' && parts[1]){ await pageProduct(parts[1]); return; }
    if(parts[0]==='cart'){ pageCart(); return; }
    if(parts[0]==='checkout'){ pageCheckout(); return; }
    if(parts[0]==='order-confirmation'){ pageOrderConfirmation(); return; }
    if(parts[0]==='about'){ pageStatic(t('about'), `<p>${LANG==='ar'?'توب فيس علامة تجميل أردنية تقدم مكياجاً عصرياً للوجه والعيون والشفاه والبشرة، لكل من يعتبر المكياج وسيلة تعبير عن الذات.':'TOPFACE is a Jordanian beauty brand offering modern makeup for face, eyes, lips and skin — for people who treat makeup as self-expression, not routine.'}</p>`); return; }
    if(parts[0]==='contact'){ pageStatic(t('contact'), `<p>WhatsApp: <a href="https://wa.me/${esc(SITE_SETTINGS.social?.whatsapp||SITE_SETTINGS.contact?.whatsapp||'')}">+${esc(SITE_SETTINGS.contact?.phone||'')}</a></p>${SITE_SETTINGS.social?.instagram?`<p>Instagram: <a href="${esc(SITE_SETTINGS.social.instagram)}" target="_blank" rel="noopener">@topface.jordan</a></p>`:''}${SITE_SETTINGS.contact?.email?`<p>Email: <a href="mailto:${esc(SITE_SETTINGS.contact.email)}">${esc(SITE_SETTINGS.contact.email)}</a></p>`:''}`); return; }
    if(parts[0]==='faq'){ pageStatic(t('faq'), `<p>${LANG==='ar'?'سيتم نشر الأسئلة الشائعة قريباً.':'Frequently asked questions will be published here soon.'}</p>`); return; }
    if(parts[0]==='shipping-returns'){ const sfee = SITE_SETTINGS.shipping?.flat_fee, sfree = SITE_SETTINGS.shipping?.free_over;
      pageStatic(t('shipping_returns'), `<p>${LANG==='ar'?`الدفع عند الاستلام متاح حالياً. رسوم التوصيل ${sfee?fmtPrice(sfee):''}${sfree?` (مجاني للطلبات فوق ${fmtPrice(sfree)})`:''}.`:`Cash on Delivery is currently available. Delivery fee is ${sfee?fmtPrice(sfee):'calculated at checkout'}${sfree?` (free over ${fmtPrice(sfree)})`:''}.`}</p>`); return; }
    if(parts[0]==='privacy'){ pageStatic(t('privacy'), `<p>${LANG==='ar'?'سيتم نشر سياسة الخصوصية قريباً.':'Our privacy policy will be published here soon.'}</p>`); return; }
    if(parts[0]==='terms'){ pageStatic(t('terms'), `<p>${LANG==='ar'?'سيتم نشر الشروط والأحكام قريباً.':'Our terms and conditions will be published here soon.'}</p>`); return; }
    if(parts[0]==='journal'){ pageStatic(LANG==='ar'?'المجلة':'Journal', `<p>${LANG==='ar'?'قريباً.':'Coming soon.'}</p>`); return; }
    await page404();
  } catch(err){
    console.error('Router error:', err);
    qs('#app').innerHTML = `${headerHTML()}<main class="wrap section">${emptyState('Something went wrong', err.message||'', `<a class="btn accent" href="#/">${t('back_home')}</a>`)}</main>${footerHTML()}`;
  } finally {
    renderCartCount();
    window.scrollTo(0,0);
  }
}

/* ---------------- init ---------------- */
function init(){
  applyLangAttrs();
  document.getElementById('overlay').addEventListener('click', ()=>{ toggleCart(false); toggleMobile(false); });
  document.body.addEventListener('click', (e)=>{
    if(e.target.id === 'mobileOpenBtn' || e.target.closest('#mobileOpenBtn')){
      qs('#mobileDrawer').innerHTML = mobileDrawerHTML();
      toggleMobile(true);
    }
  });
  window.addEventListener('hashchange', router);
  loadSiteSettings().finally(router);
}
init();
</script>
</body>
